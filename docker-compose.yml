name: fraudebot

x-host-user: &host_user "${FRAUDEBOT_UID:-0}:${FRAUDEBOT_GID:-0}"

services:
  backend:
    build:
      context: .
      dockerfile: php/Dockerfile
    image: laravel-clean-app
    working_dir: /var/www/backend
    user: *host_user
    environment:
      HOME: /tmp
      COMPOSER_HOME: /tmp/composer
      COMPOSER_CACHE_DIR: /tmp/composer-cache
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:9000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-fraudebot}
      DB_USERNAME: ${MYSQL_USER:-fraudebot}
      DB_PASSWORD: ${MYSQL_PASSWORD:-fraudebot}
      REDIS_HOST: cache
      CACHE_STORE: redis
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
    volumes:
      - ../fraudebot-backend:/var/www/backend
      - ./php/conf.d/php.ini:/usr/local/etc/php/conf.d/php.ini:ro
      - ./php/conf.d/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini:ro
      - ./php/entrypoint.sh:/usr/local/bin/fraudebot-entrypoint:ro
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    networks:
      - fraudebot-api-network
    command: fraudebot-entrypoint

  web:
    image: nginx:alpine
    ports:
      - "9000:80"
    volumes:
      - ../fraudebot-backend:/var/www/backend:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - fraudebot-network
      - fraudebot-api-network
    depends_on:
      - backend

  frontend:
    image: node:20-alpine
    working_dir: /app
    user: *host_user
    environment:
      HOME: /tmp
      NPM_CONFIG_CACHE: /tmp/.npm
      VITE_API_BASE_URL: /api
      VITE_API_PROXY_TARGET: http://web
    volumes:
      - ../fraudebot-frontend:/app
    ports:
      - 80:80
    command: sh -c "if [ -f package.json ]; then npm install && npm run dev; else tail -f /dev/null; fi"
    networks:
      - fraudebot-network

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fraudebot}
      MYSQL_USER: ${MYSQL_USER:-fraudebot}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-fraudebot}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-fraudebot-root}
    ports:
      - 3306:3306
    volumes:
      - fraudebot-db-data:/var/lib/mysql
      - ./db/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    networks:
      - fraudebot-api-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-fraudebot-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  cache:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - 6379:6379
    volumes:
      - fraudebot-cache-data:/data
    networks:
      - fraudebot-api-network

networks:
  fraudebot-network:
    driver: bridge

  fraudebot-api-network:
    driver: bridge

volumes:
  fraudebot-db-data:
  fraudebot-cache-data:
